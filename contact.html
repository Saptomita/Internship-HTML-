<html lang="en">
<head>
    <title>Contact Us - Cozy Corner Cafe</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #fff3e6;
            color: #4e342e;
        }

        nav {
            background-color: #6f4e37;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: 600;
        }

        nav a:hover {
            color: #ffd180;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #6f4e37;
        }

        label {
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            border: 1px solid #c8a27a;
            border-radius: 7px;
            font-family: 'Poppins', sans-serif;
        }

        textarea {
            height: 100px;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #d2691e;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        input[type="submit"]:hover {
            background-color: #a0522d;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="location.html">Location</a>
    </nav>

    <div class="container">

        <h1>Contact Us</h1>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Message:</label>
        <textarea placeholder="Enter your message"></textarea>

        <input type="submit" value="Send Message">

    </div>

</body>
</html>
